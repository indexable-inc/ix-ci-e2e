name: HIL Grim E2E

on:
  push:
    branches: [hil-grim-e2e-20261015]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grim-build:
    runs-on: [self-hosted, ix]
    timeout-minutes: 30
    steps:
      - name: Checkout Grim
        uses: actions/checkout@v4
        with:
          repository: GrimAnticheat/Grim
          fetch-depth: 1
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Guest storage write/read
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/hil-grim-storage-proof"
          printf 'hil-grim-%s\n' "$GITHUB_RUN_ID" > "$marker"
          test "$(cat "$marker")" = "hil-grim-$GITHUB_RUN_ID"
          df -h /
      - name: Build Grim 3.1
        run: ./gradlew build --no-daemon
