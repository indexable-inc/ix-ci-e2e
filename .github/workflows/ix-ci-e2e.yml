name: ix CI e2e

# The runners are owned by the ix-hosted webhook control plane (the ix-runners
# GitHub App delivers workflow_job events to ix-server, ix-runner-control
# boots one machine per queued job). This repository carries NO reconcile
# job, no IX_TOKEN and no RUNNER_PAT: a second owner of the pool (the
# ix-runners action) double-spawns against it. Where the VMs land is decided
# by the control plane (the pool row's regions and its ix endpoint), not by
# this workflow, so IX_SERVER and IX_REGION cannot retarget it; they are
# printed as the expectation and the job fails if the runner disagrees.

on:
  push:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Runner architecture label, x86_64 or arm64. Empty: repository variable IX_RUNNER_ARCH, else no arch label (x86_64). Graviton-only regions need arm64.'
        type: string
        default: ''
      expect_region:
        description: 'Region the runner VM is expected in (informational, e.g. us-west-2). Empty: repository variable IX_REGION.'
        type: string
        default: ''

permissions:
  contents: read

env:
  EXPECT_REGION: ${{ inputs.expect_region || vars.IX_REGION }}
  EXPECT_SERVER: ${{ vars.IX_SERVER }}
  EXPECT_ARCH: ${{ inputs.arch || vars.IX_RUNNER_ARCH }}

jobs:
  runner-1:
    runs-on: ${{ fromJSON((inputs.arch || vars.IX_RUNNER_ARCH) == 'arm64' && '["self-hosted","ix","arm64"]' || '["self-hosted","ix"]') }}
    timeout-minutes: 10
    steps:
      - name: Inspect ix runner
        shell: bash
        run: |
          set -euo pipefail
          uname -a; nproc; df -h
          echo "expected server: ${EXPECT_SERVER:-default} region: ${EXPECT_REGION:-unset}"
          case "${EXPECT_ARCH:-}" in
            arm64) test "$(uname -m)" = aarch64 ;;
            x86_64) test "$(uname -m)" = x86_64 ;;
          esac
          echo ok
  runner-2:
    runs-on: ${{ fromJSON((inputs.arch || vars.IX_RUNNER_ARCH) == 'arm64' && '["self-hosted","ix","arm64"]' || '["self-hosted","ix"]') }}
    timeout-minutes: 10
    steps:
      - name: Inspect ix runner
        shell: bash
        run: |
          set -euo pipefail
          uname -a; nproc; df -h
          echo ok
